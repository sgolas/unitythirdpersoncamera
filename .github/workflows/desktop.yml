name: Build Windows desktop app

# Runs when desktop files change on the dev branch, on a `desktop-v*` tag, or
# manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
    branches:
      - 'claude/vacation-budget-android-app-7ibjoc'
    paths:
      - '.github/workflows/desktop.yml'
      - 'TravelPlanner/desktop/**'

permissions:
  contents: write   # needed to publish a GitHub Release when built from a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the web app
        working-directory: TravelPlanner
        run: |
          npm ci
          npm run build

      # Code signing activates automatically once these repo secrets exist.
      # We only export CSC_LINK when a cert is actually present — an empty
      # CSC_LINK makes electron-builder error, so unsigned builds must leave it
      # unset entirely.
      - name: Configure code signing (only when a certificate is set)
        shell: bash
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT" ]; then
            echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            echo "CSC_LINK=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PW" >> "$GITHUB_ENV"
            echo "Code signing certificate configured."
          else
            echo "No signing certificate secret — building unsigned."
          fi

      - name: Build the Windows app (publish a Release on a desktop-v* tag or a manual run)
        working-directory: TravelPlanner/desktop
        env:
          # GitHub Releases hosting for auto-update (electron-updater).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npx electron-builder --win --publish ${{ (startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch') && 'always' || 'never' }}

      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v4
        with:
          name: trip-planner-windows
          path: |
            TravelPlanner/desktop/release/*.exe
          if-no-files-found: error

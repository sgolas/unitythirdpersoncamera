name: Build Windows desktop app

# Runs when desktop files change on the dev branch, on a `desktop-v*` tag, or
# manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
    branches:
      - 'claude/vacation-budget-android-app-7ibjoc'
    paths:
      - '.github/workflows/desktop.yml'
      - 'TravelPlanner/desktop/**'

permissions:
  contents: write   # needed to publish a GitHub Release when built from a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the web app
        working-directory: TravelPlanner
        run: |
          npm ci
          npm run build

      - name: Build the Windows app (publish a Release only on a desktop-v* tag)
        working-directory: TravelPlanner/desktop
        env:
          # GitHub Releases hosting for auto-update (electron-updater).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — activates automatically once these repo secrets exist;
          # left empty, electron-builder just produces an unsigned build.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          npm install
          npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'always' || 'never' }}

      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v4
        with:
          name: trip-planner-windows
          path: |
            TravelPlanner/desktop/release/*.exe
          if-no-files-found: error

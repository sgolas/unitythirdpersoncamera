<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- rounded square bg -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- faint globe longitude/latitude lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="6" fill="none">
    <circle cx="512" cy="512" r="360"/>
    <ellipse cx="512" cy="512" rx="150" ry="360"/>
    <line x1="152" y1="512" x2="872" y2="512"/>
    <path d="M180 380 Q512 300 844 380"/>
    <path d="M180 644 Q512 724 844 644"/>
  </g>

  <!-- SG monogram -->
  <text x="512" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="440"
        font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-10">SG</text>

  <!-- travel accent: airplane arc -->
  <path d="M300 700 Q512 620 724 700" stroke="url(#accent)" stroke-width="16"
        stroke-linecap="round" fill="none" stroke-dasharray="4 34"/>
  <g transform="translate(724 700) rotate(28)">
    <path d="M0 -34 L14 26 L0 14 L-14 26 Z" fill="url(#accent)"/>
  </g>
</svg>
